id: PG-38
category: networking
title: Binding failed for port?
situation: >-
  A build goes to `ERROR`, or a live migration is refused at once. Neutron could not bind the port on that
  host. Ports already bound keep working.

diagram:
  type: branches
  head: [The neutron-server log says, The cause is]
  split: 52
  rows:
    - see: "Refusing to bind port ... to dead agent"
      mono: true
      means: The agent is dead
      sub: OVS agent or ovn-controller of that host
      tone: stop
    - see: "... no OVN chassis for host: <host>"
      mono: true
      means: Host names differ
      sub: A short name on one side, an FQDN on the other
      tone: warn
    - see: "... not supporting physical network"
      mono: true
      means: No bridge mapping
      sub: That host lacks the provider network
      tone: warn
  note: >-
    With ML2/OVS, the last two cases are logged at debug level only: the agent list and the network type tell
    them apart.

checks:
  - label: The port, if it still exists
    hint: openstack port show <port> -c binding_host_id -c binding_vif_type
  - label: Network type, physical network
    hint: openstack network show <network> -c provider:network_type
  - label: Agents under that host name
    hint: openstack network agent list --host <compute>
  - label: Which driver refused, and why
    hint: grep <port-id> neutron-server.log | grep -iE 'bind|refusing'

caution:
  - level: avoid
    text: >-
      Changing Nova's `host` on a compute that has instances. Change the Neutron side to the name Nova
      already uses.
  - level: state-changing
    text: >-
      With OVN on Kolla-Ansible, changing the chassis hostname restarts `openvswitch_vswitchd`: instances
      there can lose the network briefly.

lesson: Nova names the host. Neutron must find a live agent, with the right mappings, under that exact name.

runbook:
  path: networking/port-binding-failed.md
  status: draft
  release: "2026.1"
  also:
    - lifecycle/instance-stuck-in-build-waiting-for-vif-plugged.md

scope: >-
  The runbook is a draft, written from the Neutron and Nova 2026.1 sources. A dead agent, mismatched host
  names and a missing mapping were reproduced on an ML2/OVS Kolla-Ansible lab; the ML2/OVN parts and an
  unsupported network type were not. Ports Nova created for a build are deleted when it fails. SR-IOV,
  hardware offload, routed provider networks and Ironic ports are not covered.

linkedin:
  title: "\"Binding failed for port\": the Neutron server log already says why"
  caption: |
    A build ends in ERROR, or a live migration is refused before it starts: "Binding failed for port, please check neutron logs for more information."

    For once the message is right. The answer is in the Neutron server log, for that port ID.

    When Nova allocates or moves a port, it gives Neutron a host name. Neutron then asks each mechanism driver to bind the port on that host. Three usual refusals:
    → the agent on that host is dead
    → no agent or chassis is registered under that exact name: a short name on one side, an FQDN on the other
    → the host has no bridge mapping for the network's physical network

    One rule when names differ: change the Neutron side, never Nova's host on a compute that has instances.

    Source runbook status: draft.
  hashtags: [OpenStack, Neutron, Nova, Networking, CloudOperations, OzarLand]
